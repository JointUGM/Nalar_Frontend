<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15213B" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=nala" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=nala" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=nala" />
    <link rel="shortcut icon" href="/favicon.ico?v=nala" />
    <title>NALAR</title>
  </head>
  <body>
    <script>
      // Keep in sync with src/ui/theme.ts: public pages stay light; signed-in pages restore the saved theme.
      try {
        var path = location.pathname
        var open = path === '/' || /^\/(login|activate|reset-password)(\/|$)/.test(path)
        if (!open && localStorage.getItem('nalar.theme') === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (error) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
